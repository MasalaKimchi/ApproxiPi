<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" role="img" aria-labelledby="title desc"><title id="title">Phase breakdown at 1000000 digits</title><desc id="desc">Median split/finalize/format wall time per verified algorithm.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:22px;font-weight:700;fill:#111827}.subtitle{font-size:12px;fill:#64748b}.axis{stroke:#1f2937;stroke-width:1.4}.grid{stroke:#d7dde8;stroke-width:1}.tick{font-size:11px;fill:#64748b}.label{font-size:12px;fill:#111827}.legend{font-size:12px;fill:#111827}</style><rect width="960" height="612" fill="#fff"/><text class="title" x="40" y="38">Phase breakdown at 1,000,000 digits</text><text class="subtitle" x="40" y="58">Median wall time per phase; the unshaded remainder is scheduling/conversion overhead.</text><rect x="40" y="74" width="14" height="14" rx="3" fill="#2155d9"/><text class="legend" x="62" y="86">series/split</text><rect x="210" y="74" width="14" height="14" rx="3" fill="#dc2626"/><text class="legend" x="232" y="86">finalize</text><rect x="380" y="74" width="14" height="14" rx="3" fill="#f59e0b"/><text class="legend" x="402" y="86">format</text><text class="label" x="40" y="129">Crown + autotune</text><rect x="230" y="110" width="26.04" height="30" rx="4" fill="#e2e8f0"/><rect x="230" y="110" width="12.98" height="30" fill="#2155d9"/><rect x="242.98" y="110" width="7.08" height="30" fill="#dc2626"/><rect x="250.07" y="110" width="5.86" height="30" fill="#f59e0b"/><text class="tick" x="264.04" y="129">59.25 ms</text><text class="label" x="40" y="177">Truncated crown (ours)</text><rect x="230" y="158" width="26.07" height="30" rx="4" fill="#e2e8f0"/><rect x="230" y="158" width="12.95" height="30" fill="#2155d9"/><rect x="242.95" y="158" width="7.12" height="30" fill="#dc2626"/><rect x="250.07" y="158" width="5.87" height="30" fill="#f59e0b"/><text class="tick" x="264.07" y="177">59.31 ms</text><text class="label" x="40" y="225"