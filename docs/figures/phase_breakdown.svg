<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 596" role="img" aria-labelledby="title desc"><title id="title">Phase breakdown at 1000000 digits</title><desc id="desc">Median split/finalize/format wall time per verified algorithm.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:22px;font-weight:700;fill:#111827}.subtitle{font-size:13px;fill:#64748b}.axis{stroke:#1f2937;stroke-width:1.5}.grid{stroke:#e2e8f0;stroke-width:1}.tick{font-size:12px;fill:#64748b}.label{font-size:13px;font-weight:600;fill:#111827}.legend{font-size:13px;fill:#111827}.legend-box{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}.refline{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 4}</style><rect width="970" height="596" fill="#fff"/><text class="title" x="40" y="38">Phase breakdown at 1,000,000 digits</text><text class="subtitle" x="40" y="58">Stacked bars show split, finalize, and format; light gray is remaining overhead.</text><rect class="legend-box" x="36" y="540" width="898" height="36" rx="8"/><rect x="56" y="550" width="16" height="16" rx="3" fill="#2155d9"/><text class="legend" x="80" y="564">series / split</text><rect x="256" y="550" width="16" height="16" rx="3" fill="#dc2626"/><text class="legend" x="280" y="564">finalize</text><rect x="456" y="550" width="16" height="16" rx="3" fill="#f59e0b"/><text class="legend" x="480" y="564">format</text><rect x="656" y="550" width="16" height="16" rx="3" fill="#e2e8f0"/><text class="legend" x="680" y="564">overhead</text><text class="label" x="36" y="116" text-anchor="end">Crown + autotune</text><rect x="230" y="96" width="26.91" height="32" rx="5" fill="#e2e8f0"/><rect x="230" y="96" width="13.42" height="32" fill="#2155d9"/><rect x="243.42" y="96" width="7.32" height="32" fill="#dc2626"/><rect x="250.74" y="96" width="6.05" height="32" fill="#f59e0b"/><text class="tick" x="266.91" y="116">59.25 ms</text><text class="label" x="36" y="162" text-anchor="end">Truncated crown (ours)<