<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Hypothesis ledger progression</title><desc id="desc">Median verified wall time at one million digits after each confirmed hypothesis.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:22px;font-weight:700;fill:#111827}.subtitle{font-size:12px;fill:#64748b}.axis{stroke:#1f2937;stroke-width:1.4}.grid{stroke:#d7dde8;stroke-width:1}.tick{font-size:11px;fill:#64748b}.label{font-size:12px;fill:#111827}.legend{font-size:12px;fill:#111827}</style><rect width="960" height="540" fill="#fff"/><text class="title" x="40" y="38">Wall time at 1,000,000 digits across the hypothesis ledger</text><text class="subtitle" x="40" y="58">Verified medians; refuted hypotheses (H5, H9b, H10) were reverted and do not appear as stages.</text><line class="grid" x1="90" y1="420" x2="830" y2="420"/><text class="tick" x="80" y="424" text-anchor="end">0</text><line class="grid" x1="90" y1="371.52" x2="830" y2="371.52"/><text class="tick" x="80" y="375.52" text-anchor="end">25</text><line class="grid" x1="90" y1="323.03" x2="830" y2="323.03"/><text class="tick" x="80" y="327.03" text-anchor="end">50</text><line class="grid" x1="90" y1="274.55" x2="830" y2="274.55"/><text class="tick" x="80" y="278.55" text-anchor="end">75</text><line class="grid" x1="90" y1="226.06" x2="830" y2="226.06"/><text class="tick" x="80" y="230.06" text-anchor="end">100</text><line class="grid" x1="90" y1="177.58" x2="830" y2="177.58"/><text class="tick" x="80" y="181.58" text-anchor="end">125</text><line class="grid" x1="90" y1="129.09" x2="830" y2="129.09"/><text class="tick" x="80" y="133.09" text-anchor="end">150</text><line class="axis" x1="90" y1="420" x2="830" y2="420"/><line class="axis" x1="90" y1="90" x2="90" y2="420"/><text class="label" transform="translate(28 255) rotate(-90)" text-anchor="middle">Median wall (ms)</text><path d="M90 140.34 L172.22 166.91 L254.44 240.41 L336.67 278.81 L418.89 284.44 L501.11 280.56 L583.33 287.73 L665.56 295.88 L747.78 298.4 L830 303.64" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-linejoin="round"/><circle cx="90" cy="140.34" r="4.5" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><text class="tick" x="90" y="128.34" text-anchor="middle" font-weight="700">144.2</text><text class="tick" transform="translate(90 434) rotate(35)" text-anchor="start">H0 baseline</text><circle cx="172.22" cy="166.91" r="4.5" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><text class="tick" x="172.22" y="154.91" text-anchor="middle" font-weight="700">130.5</text><text class="tick" transform="translate(172.22 434) rotate(35)" text-anchor="start">H1 crown</text><circle cx="254.44" cy="240.41" r="4.5" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><text class="tick" x="254.44" y="228.41" text-anchor="middle" font-weight="700">92.6</text><text class="tick" transform="translate(254.44 434) rotate(35)" text-anchor="start">H2 pipeline</text><circle cx="336.67" cy="278.81" r="4.5" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><text class="tick" x="336.67" y="266.81" text-anchor="middle" font-weight="700">72.8</text><text class="tick" transform="translate(336.67 434) rotate(35)" text-anchor="start">H3 intra-node</text><circle cx="418.89" cy="284.44" r="4.5" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><text class="tick" x="418.89" y="272.44" text-anchor="middle" font-weight="700">69.9</text><text class="tick" transform="translate(418.89 434) rotate(35)" text-anchor="start">H4 warm Newton</text><circle cx="501.11" cy="280.56" r="4.5" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><text class="tick" x="501.11" y="268.56" text-anchor="middle" font-weight="700">71.9</text><text class="tick" transform="translate(501.11 434) rotate(35)" text-anchor="start">H7 root-Q elision</text><circle cx="583.33" cy="287.73" r="4.5" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><text class="tick" x="583.33" y="275.73" text-anchor="middle" font-weight="700">68.2</text><text class="tick" transform="translate(583.33 434) rotate(35)" text-anchor="start">H9a deeper crown</text><circle cx="665.56" cy="295.88" r="4.5" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><text class="tick" x="665.56" y="283.88" text-anchor="middle" font-weight="700">64</text><text class="tick" transform="translate(665.56 434) rotate(35)" text-anchor="start">H1-H9 final</text><circle cx="747.78" cy="298.4" r="4.5" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><text class="tick" x="747.78" y="286.4" text-anchor="middle" font-weight="700">62.7</text><text class="tick" transform="translate(747.78 434) rotate(35)" text-anchor="start">H11 autotune</text><circle cx="830" cy="303.64" r="4.5" fill="#dc2626" stroke="#fff" stroke-width="1.4"/><text class="tick" x="830" y="291.64" text-anchor="middle" font-weight="700">60</text><text class="tick" transform="translate(830 434) rotate(35)" text-anchor="start">H12 spliced prefix</text></svg>