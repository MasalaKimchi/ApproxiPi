<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1002 612" role="img" aria-labelledby="title desc"><title id="title">Hypothesis ledger progression</title><desc id="desc">Median verified wall time at one million digits after each confirmed hypothesis.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:22px;font-weight:700;fill:#111827}.subtitle{font-size:13px;fill:#64748b}.axis{stroke:#1f2937;stroke-width:1.5}.grid{stroke:#e2e8f0;stroke-width:1}.tick{font-size:12px;fill:#64748b}.label{font-size:13px;font-weight:600;fill:#111827}.legend{font-size:13px;fill:#111827}.legend-box{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}.refline{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 4}</style><rect width="1002" height="612" fill="#fff"/><text class="title" x="40" y="38">Wall time at 1,000,000 digits across the hypothesis ledger</text><text class="subtitle" x="40" y="58">Verified medians; refuted hypotheses (H5, H9b, H10) were reverted.</text><line class="grid" x1="90" y1="380" x2="830" y2="380"/><text class="tick" x="80" y="384" text-anchor="end">0</text><line class="grid" x1="90" y1="337.39" x2="830" y2="337.39"/><text class="tick" x="80" y="341.39" text-anchor="end">25</text><line class="grid" x1="90" y1="294.78" x2="830" y2="294.78"/><text class="tick" x="80" y="298.78" text-anchor="end">50</text><line class="grid" x1="90" y1="252.18" x2="830" y2="252.18"/><text class="tick" x="80" y="256.18" text-anchor="end">75</text><line class="grid" x1="90" y1="209.57" x2="830" y2="209.57"/><text class="tick" x="80" y="213.57" text-anchor="end">100</text><line class="grid" x1="90" y1="166.96" x2="830" y2="166.96"/><text class="tick" x="80" y="170.96" text-anchor="end">125</text><line class="grid" x1="90" y1="124.35" x2="830" y2="124.35"/><text class="tick" x="80" y="128.35" text-anchor="end">150</text><line class="axis" x1="90" y1="380" x2="830" y2="380"/><line class="axis" x1="90" y1="90" x2="90" y2="380"/><text class="label" transform="translate(28 235) rotate(-90)" text-anchor="middle">Median wall (ms)</text><text class="label" x="460" y="416" text-anchor="middle">Hypothesis stage</text><path d="M90 134.24 L172.22 157.59 L254.44 222.18 L336.67 255.93 L418.89 260.87 L501.11 257.46 L583.33 263.77 L665.56 270.92 L747.78 273.14 L830 277.74" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/><circle cx="90" cy="134.24" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.8"/><text class="tick" x="90" y="120.24" text-anchor="middle" font-weight="700">144.2</text><text class="tick" x="90" y="398" text-anchor="middle">1</text><circle cx="172.22" cy="157.59" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.8"/><text class="tick" x="172.22" y="143.59" text-anchor="middle" font-weight="700">130.5</text><text class="tick" x="172.22" y="398" text-anchor="middle">2</text><circle cx="254.44" cy="222.18" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.8"/><text class="tick" x="254.44" y="208.18" text-anchor="middle" font-weight="700">92.6</text><text class="tick" x="254.44" y="398" text-anchor="middle">3</text><circle cx="336.67" cy="255.93" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.8"/><text class="tick" x="336.67" y="241.93" text-anchor="middle" font-weight="700">72.8</text><text class="tick" x="336.67" y="398" text-anchor="middle">4</text><circle cx="418.89" cy="260.87" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.8"/><text class="tick" x="418.89" y="246.87" text-anchor="middle" font-weight="700">69.9</text><text class="tick" x="418.89" y="398" text-anchor="middle">5</text><circle cx="501.11" cy="257.46" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.8"/><text class="tick" x="501.11" y="243.46" text-anchor="middle" font-weight="700">71.9</text><text class="tick" x="501.11" y="398" text-anchor="middle">6</text><circle cx="583.33" cy="263.77" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.8"/><text class="tick" x="583.33" y="249.77" text-anchor="middle" font-weight="700">68.2</text><text class="tick" x="583.33" y="398" text-anchor="middle">7</text><circle cx="665.56" cy="270.92" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.8"/><text class="tick" x="665.56" y="256.92" text-anchor="middle" font-weight="700">64</text><text class="tick" x="665.56" y="398" text-anchor="middle">8</text><circle cx="747.78" cy="273.14" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.8"/><text class="tick" x="747.78" y="259.14" text-anchor="middle" font-weight="700">62.7</text><text class="tick" x="747.78" y="398" text-anchor="middle">9</text><circle cx="830" cy="277.74" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.8"/><text class="tick" x="830" y="263.74" text-anchor="middle" font-weight="700">60</text><text class="tick" x="830" y="398" text-anchor="middle">10</text><rect class="legend-box" x="36" y="436" width="930" height="160" rx="8"/><text class="legend" x="52" y="460"><tspan font-weight="700">1.</tspan> H0 baseline (144.2 ms) — exact binary splitting</text><text class="legend" x="52" y="484"><tspan font-weight="700">2.</tspan> H1 crown (130.5 ms) — truncated MPFR crown</text><text class="legend" x="52" y="508"><tspan font-weight="700">3.</tspan> H2 pipeline (92.6 ms) — overlap constants + parallel format</text><text class="legend" x="52" y="532"><tspan font-weight="700">4.</tspan> H3 intra-node (72.8 ms) — parallel root products</text><text class="legend" x="52" y="556"><tspan font-weight="700">5.</tspan> H4 warm Newton (69.9 ms) — warm-start 1/T</text><text class="legend" x="502" y="460"><tspan font-weight="700">6.</tspan> H7 root-Q elision (71.9 ms) — never form root Q</text><text class="legend" x="502" y="484"><tspan font-weight="700">7.</tspan> H9a deeper crown (68.2 ms) — more chunks</text><text class="legend" x="502" y="508"><tspan font-weight="700">8.</tspan> H1-H9 final (64 ms) — hand-tuned configuration</text><text class="legend" x="502" y="532"><tspan font-weight="700">9.</tspan> H11 autotune (62.7 ms) — knob search (refuted: &lt;2%)</text><text class="legend" x="502" y="556"><tspan font-weight="700">10.</tspan> H12 spliced prefix (60 ms) — render high half under Newton correction</text></svg>