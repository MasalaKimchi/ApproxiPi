<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1032 282" role="img" aria-labelledby="title desc"><title id="title">Phase breakdown at 10000000 digits</title><desc id="desc">Median split/finalize/format wall time per verified algorithm.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:22px;font-weight:700;fill:#111827}.subtitle{font-size:13px;fill:#64748b}.axis{stroke:#1f2937;stroke-width:1.5}.grid{stroke:#e2e8f0;stroke-width:1}.tick{font-size:12px;fill:#64748b}.label{font-size:13px;font-weight:600;fill:#111827}.legend{font-size:13px;fill:#111827}.legend-box{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}.refline{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 4}</style><rect width="1032" height="282" fill="#fff"/><text class="title" x="40" y="38">Phase breakdown at 10^7 digits</text><text class="subtitle" x="40" y="58">Stacked bars show split, finalize, and format; light gray is remaining overhead.</text><rect class="legend-box" x="36" y="222" width="960" height="36" rx="8"/><rect x="56" y="232" width="16" height="16" rx="3" fill="#2155d9"/><text class="legend" x="80" y="246">series / split</text><rect x="256" y="232" width="16" height="16" rx="3" fill="#dc2626"/><text class="legend" x="280" y="246">finalize</text><rect x="456" y="232" width="16" height="16" rx="3" fill="#f59e0b"/><text class="legend" x="480" y="246">format</text><rect x="656" y="232" width="16" height="16" rx="3" fill="#e2e8f0"/><text class="legend" x="680" y="246">overhead</text><text class="label" x="240" y="116" text-anchor="end">Truncated crown (ours)</text><rect x="272" y="96" width="146.31" height="32" rx="5" fill="#e2e8f0"/><rect x="272" y="96" width="62.68" height="32" fill="#2155d9"/><rect x="334.68" y="96" width="54.79" height="32" fill="#dc2626"/><rect x="389.48" y="96" width="28.83" height="32" fill="#f59e0b"/><text class="tick" x="428.31" y="116">1239.29 ms</text><text class="label" x="240" y="162" text-anchor="end">Chudnovsky BS</text><rect x="272" y="142" width="620" height="32" rx="5" fill="#e2e8f0"/><rect x="272" y="142" width="431.6" height="32" fill="#2155d9"/><rect x="703.6" y="142" width="73.63" height="32" fill="#dc2626"/><rect x="777.23" y="142" width="114.77" height="32" fill="#f59e0b"/><text class="tick" x="902" y="162">5251.47 ms</text></svg>